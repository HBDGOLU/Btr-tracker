:root[data-theme=dark]{--bg:#0b0a1e;--fg:#eef0ff;--c:#ffffff12;--b:#ffffff25}

body{margin:0;background:radial-gradient(circle at 20% 0,#7c3aed55,transparent 45%),radial-gradient(circle at 90% 30%,#06b6d444,transparent 40%),var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding-bottom:78px;min-height:100vh}

.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:12px;margin:10px 0;backdrop-filter:blur(8px)}

button,select,input{font:inherit;color:var(--fg);background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px}
button{cursor:pointer}.big{display:block;width:100%;font-size:20px;font-weight:700;background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;border:0;padding:16px}
.stop{background:linear-gradient(90deg,#ef4444,#f59e0b)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}th{opacity:.7}.w{overflow-x:auto}
.bar{height:9px;border-radius:9px;background:var(--b);overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;border-radius:9px;transition:width .6s}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--b);z-index:5}
nav button{flex:1;padding:12px 4px}nav .on{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;border:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap}.chips .on{background:var(--a);color:#fff}
.up{color:var(--g)}.dn{color:var(--r)}.sm{font-size:12px;opacity:.75}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}

.sb{margin:3px;font-size:13px}.sb.on{background:var(--a);color:#fff}
.modal{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}.modal>div{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.modal input,.modal select{width:100%;margin:4px 0}
.fx{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;animation:fi .4s}
.fx.win{background:radial-gradient(#10b981cc,#064e3bee)}.fx.lose{background:radial-gradient(#ef4444cc,#450a0aee);animation:fi .4s,shake .5s .4s 3}
.fx .big{font-size:110px;width:auto;background:none;animation:pop 1s infinite alternate}.fx h1{color:#fff;font-size:44px;margin:0}.fx p{color:#fff;padding:0 20px}
.cf{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@keyframes pop{to{transform:scale(1.25) rotate(8deg)}}@keyframes fi{from{opacity:0}}@keyframes shake{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
body{background:linear-gradient(135deg,#7c3aed33,#06b6d433,#f472b633,#7c3aed33) fixed,var(--bg);background-size:300% 300%,auto;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 100%,0 0}}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card{animation:up .45s both;box-shadow:0 8px 30px -14px #7c3aed}
.hero{text-align:center;border:1px solid #7c3aed88;box-shadow:0 0 40px -10px #22d3ee}
.cw{position:relative;width:min(78vw,300px);margin:6px auto}.cw svg{width:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 6px #22d3ee)}
#rg{transition:stroke-dashoffset .3s linear}
.dig{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(30px,9.5vw,50px) ui-monospace,monospace;text-shadow:0 0 18px #7c3aed}
.st{margin:4px 0 10px;opacity:.85}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.rb{transform-box:fill-box;transform-origin:bottom;animation:grow .8s both}@keyframes grow{from{transform:scaleY(0)}}
.ring{width:54px;height:54px;border-radius:50%;flex:none;background:conic-gradient(var(--c1,#22d3ee) calc(var(--p)*1%),var(--b) 0);display:grid;place-items:center;position:relative}
.ring:before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--bg)}.ring span{position:relative;font-size:12px;font-weight:700}
.four{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px;margin:10px 0}.cc{display:flex;flex-direction:column;align-items:center;gap:4px}
.sj{border-left:4px solid var(--c1)}.sj.op{box-shadow:0 0 0 1.5px var(--c1),0 0 30px -8px var(--c1)}
button:active{transform:scale(.96)}.big{box-shadow:0 8px 24px -8px var(--a)}
.ps{table-layout:fixed;width:100%;font-size:12px}.ps td,.ps th{padding:5px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ps tr.d0 td{border-top:3px solid var(--fg)}.ps .tp{font-size:10px;opacity:.65;overflow:hidden;text-overflow:ellipsis}
.tg{border:1px solid #f472b688;background:linear-gradient(135deg,#f472b622,#7c3aed22)}

if(!S.nt)S.nt={on:false,ev:2,last:0};
function psum(){let r='';Object.keys(PL).forEach(k=>PL[k].forEach((x,j)=>{const ts=x.ix.map(i=>x.s.t[i]);r+=`<tr class="${j?'':'d0'}"><td>${j?'':'<b>'+k+' Dec</b>'}</td><td><b>${x.s.n}</b><div class=tp>${ts.map(t=>t.n).join(', ')}</div></td><td>${hm(ts.reduce((a,t)=>a+t.m,0))}</td><td>${ts.reduce((a,t)=>a+t.q,0)}</td></tr>`}));return`<table class=ps><colgroup><col style="width:17%"><col><col style="width:17%"><col style="width:13%"></colgroup><tr><th>Date</th><th>Subject / Topics</th><th>Video</th><th>MCQ</th></tr>${r}</table>`}
function curE(){const a=+($('#f1')?.value)||0,b=Math.min(+($('#f2')?.value)||0,a);if(!a)return null;return mty=='v'?{k:msk,i:mti,t:'v',v:a}:mty=='m'?{k:msk,i:mti,t:'m',c:a-b,w:b}:mty=='n'?{k:msk,t:'n',n:a}:{k:msk,t:'p',p:a}}
function acx(){const a=+$('#f1').value||0,b=Math.min(+$('#f2').value||0,a);$('#ax').innerHTML=ac('🎯 Accuracy',[{l:`${a} solved`,c:a-b,w:b}])}
function wcmp(y,t){if(!y.m||!t.m)return'<p class=sm>Galat ka comparison tab dikhega jab kal aur aaj dono din MCQ log honge.</p>';const yp=pc(y.w,y.m),tp=pc(t.w,t.m),ok=tp<yp||(tp==yp&&t.w<=y.w);return`<div class=row style="margin-top:8px"><span class=sm>Kal: ${y.m} solved, ❌ ${y.w} galat (${yp}%)<br>Aaj: ${t.m} solved, ❌ ${t.w} galat (${tp}%)</span><b class="${ok?'up':'dn'}">${ok?'✅ Galat kam hua! 🎉':'⚠️ Galat badha'}</b></div>`}
function pend(){const d=dday(),it=PL[d]||[];let tot=0,dn=0,left=[];it.forEach(x=>{const id=d+x.s.k,c=['v','q','n','p'].filter(k=>S.pl[id+k]).length;tot+=4;dn+=c;if(c<4)left.push(x.s.n)});return{d,p:pc(dn,tot),left}}
function msg(){const q=pend();return q.p<100?`🔥 Aaj ka plan ${q.p}% done. Baaki: ${q.left.slice(0,3).join(', ')}. Ek session start karo, tum kar sakte ho! 💪`:'🏆 Aaj ka plan complete! Ek MCQ round aur lagao?'}
function tgt(){return`<div class="card tg"><b>🎯 Aaj ka target</b><p class=sm style="margin:6px 0">${msg()}</p>${bar(pend().p)}</div>`}
async function ntf(x){try{const r=await navigator.serviceWorker.getRegistration();if(r)return r.showNotification('BTR Study 📚',{body:x,icon:'icon-192.png',tag:'btr',renotify:true});new Notification('BTR Study 📚',{body:x})}catch(e){}}
function nCard(){const ok='Notification' in window;return`<div class=card><b>🔔 Reminders</b><p class=sm>${ok?(S.nt.on?'ON — app khula/installed ho to yaad dilata rahunga.':'OFF — ON karke permission allow karo.'):'Is browser me notifications support nahi.'}</p><div class=two><button onclick=nOn()>${S.nt.on?'🔕 OFF karo':'🔔 ON karo'}</button><select onchange="S.nt.ev=+this.value;save()">${[1,2,3,4].map(h=>`<option value=${h} ${S.nt.ev==h?'selected':''}>Har ${h} ghanta</option>`).join('')}</select></div><button style="width:100%;margin-top:6px" onclick="ntf(msg())">🧪 Test notification</button></div>`}
function nOn(){if(!('Notification' in window))return alert('Notifications support nahi hai.');if(S.nt.on){S.nt.on=false;save();return render()}Notification.requestPermission().then(p=>{if(p=='granted'){S.nt.on=true;save();try{navigator.serviceWorker.ready.then(r=>r.periodicSync&&r.periodicSync.register('btr-remind',{minInterval:3*36e5})).catch(()=>{})}catch(e){}ntf('Reminders ON ✅ Padhai ki yaad dilata rahunga!');render()}else alert('Notification permission allow karo (browser/phone settings).')})}
function chkN(){const n=S.nt;if(!n.on||!('Notification' in window)||Notification.permission!='granted'||act())return;const h=new Date().getHours();if(h<7||h>=23||Date.now()-(n.last||0)<n.ev*36e5)return;n.last=Date.now();save();ntf(msg())}
setInterval(chkN,6e4);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chkN()});
const r0=render;render=function(){r0();if(tab==0){const m=$('#app');m.insertAdjacentHTML('beforeend',nCard());m.querySelector('h2').insertAdjacentHTML('afterend',tgt())}};
setTimeout(chkN,2000);

render();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
